[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bronchnav"
version = "0.0.1"
description = "Virtual bronchoscopy planning core: CT ingest, airway segmentation, routing, rendering."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "SimpleITK>=2.3",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
render = ["vtk>=9.3", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
# Optional NVIDIA GPU acceleration (CUDA 12 runtime libraries come with the extra). Without it everything runs on the CPU.
gpu = ["cupy-cuda12x[ctk]>=13"]
dev = ["pytest>=8"]

[project.scripts]
bronchnav = "bronchnav.cli:main"

[tool.setuptools.packages.find]
include = ["bronchnav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
